<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marvel Universe</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="glow.css" />
    <link rel="stylesheet" href="overview.css" />
    <link rel="stylesheet" href="menu.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="hidden">
    <!-- <div id="blur" class="blur hidden"></div> -->
    <div id="glow-container" class="glow-container hidden">
      <div id="glow" class="glow"></div>
    </div>

    <!-- Overview -->
    <div id="overview" class="overview hidden">
      <div id="overview-container" class="container">
        <div id="poster-container" class="poster-container">
          <img class="filler" />
          <img class="poster" />
        </div>

        <div class="info hidden">
          <h2 class="title"></h2>
          <div class="details">
            <h3 class="date">
              <span class="section">Date: </span
              ><span class="date-value"></span>
            </h3>
            <h3 class="duration">
              <span class="section">Duration: </span
              ><span class="duration-value"></span>
            </h3>
            <p class="description">
              <span class="section">Description: </span
              ><span class="description-value"></span>
            </p>
          </div>
        </div>
      </div>
    </div>

    <div class="menu">
      <button class="hide-button"></button>
    </div>

    <main>
      <div class="title-list-container">
        <ol class="list">
          <script src="list.js"></script>
          <script src="scroll.js"></script>
        </ol>
      </div>
    </main>
  </body>
</html>
